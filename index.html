<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>考場工具箱｜考試大鐘・上下課鐘・讀書番茄鐘</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #121d30;
      --panel-2: #18263c;
      --line: #2a3a53;
      --text: #f3f6fb;
      --muted: #a7b5ca;
      --cyan: #66e3ee;
      --green: #67e6ab;
      --red: #ff6577;
      --amber: #ffcc70;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(ellipse at 50% -20%, #203354 0, var(--bg) 58%); }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
    .app { width: min(1200px, 100%); margin: 0 auto; padding: 22px 24px 40px; }
    .site-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .brand { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
    .tabs { display: flex; gap: 8px; padding: 6px; border: 1px solid var(--line); background: #0e1828; border-radius: 14px; }
    .tab-button { border: 0; border-radius: 9px; color: var(--muted); background: transparent; padding: 12px 18px; font-weight: 750; }
    .tab-button[aria-selected="true"] { color: #07131d; background: var(--cyan); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .card { border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(145deg, rgba(22, 35, 56, .96), rgba(15, 25, 41, .98)); box-shadow: 0 16px 48px #0003; }
    .exam-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .page-title { margin: 0; font-size: clamp(20px, 3vw, 29px); }
    .notice-editor { display: grid; grid-template-columns: auto minmax(160px, 1fr); align-items: center; gap: 10px; margin: 16px 0; }
    .notice-editor label { font-weight: 700; color: var(--amber); white-space: nowrap; }
    .notice-editor input { min-width: 0; }
    .marquee-wrap { overflow: hidden; border: 1px solid #69572e; border-radius: 12px; background: #241e12; color: #ffe3a3; padding: 10px 0; margin-bottom: 18px; }
    .marquee-text { width: max-content; min-width: 100%; padding-left: 100%; animation: marquee 26s linear infinite; font-size: clamp(15px, 2vw, 20px); font-weight: 750; }
    @keyframes marquee { to { transform: translateX(-100%); } }
    .clock-card { text-align: center; padding: 24px 20px 22px; }
    .date-line { color: var(--muted); font-size: clamp(16px, 2vw, 21px); letter-spacing: .08em; }
    .clock { margin: 5px 0 12px; font-family: "Consolas", "SFMono-Regular", "Roboto Mono", monospace; font-size: clamp(76px, 17vw, 190px); line-height: 1.03; font-weight: 750; letter-spacing: .025em; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 0 36px #66e3ee28; }
    .exam-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; text-align: left; }
    .meta-item { padding: 13px 15px; border-radius: 12px; background: #0c1728; border: 1px solid #253651; }
    .meta-label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 5px; }
    .meta-value { display: block; min-height: 1.35em; font-size: clamp(17px, 2vw, 23px); font-weight: 750; overflow-wrap: anywhere; }
    .remaining { margin: 17px 0 0; color: var(--green); font-size: clamp(22px, 4vw, 34px); font-weight: 850; }
    .remaining.warning { color: var(--red); }
    .remaining.finished { color: var(--muted); }
    .edit-card { padding: 20px; margin-top: 18px; }
    .section-heading { margin: 0 0 15px; font-size: 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 7px; color: var(--muted); font-size: 14px; font-weight: 650; }
    input, textarea { width: 100%; min-height: 44px; border: 1px solid #394c67; border-radius: 9px; padding: 10px 12px; color: var(--text); background: #0b1524; }
    input[type="number"] { font-variant-numeric: tabular-nums; }
    input[type="file"] { padding: 8px; }
    textarea { min-height: 90px; resize: vertical; }
    .field.wide { grid-column: span 2; }
    .form-actions { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; margin-top: 16px; }
    .button { border: 1px solid #405572; border-radius: 10px; background: #1b2b43; color: var(--text); padding: 11px 16px; font-weight: 750; }
    .button:hover { filter: brightness(1.15); }
    .button.primary { border-color: var(--cyan); background: var(--cyan); color: #07151b; }
    .button.danger { border-color: #713e4a; background: #39202b; color: #ffc0c8; }
    .button.large { min-height: 94px; font-size: clamp(23px, 4vw, 34px); }
    .button.bell-class { background: linear-gradient(135deg, #163c47, #1d5b66); border-color: #3ab8c6; }
    .button.bell-dismiss { background: linear-gradient(135deg, #514021, #785923); border-color: #d3a344; }
    .status { min-height: 1.4em; color: var(--muted); font-size: 14px; }
    .status.error { color: var(--red); }
    .status.success { color: var(--green); }
    .subheading { margin: 25px 0 12px; font-size: 20px; }
    .bell-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .schedule-controls { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .toggle { display: inline-flex; gap: 10px; align-items: center; color: var(--text); font-weight: 700; }
    .toggle input { width: 22px; min-height: 22px; accent-color: var(--cyan); }
    .schedule-form { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 12px; align-items: end; margin: 16px 0; }
    .schedule-list { display: grid; gap: 9px; }
    .schedule-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 16px; border: 1px solid #2a3b54; background: #0d1828; border-radius: 11px; padding: 12px 14px; }
    .schedule-name { font-weight: 800; }
    .schedule-time { color: var(--cyan); font-family: Consolas, monospace; font-size: 17px; }
    .empty { color: var(--muted); padding: 15px 0; }
    .tomato-card { text-align: center; padding: 25px; }
    .tomato-phase { color: var(--cyan); font-weight: 800; letter-spacing: .1em; }
    .tomato-clock { margin: 12px 0 6px; font: 800 clamp(80px, 18vw, 170px)/1 "Consolas", "SFMono-Regular", monospace; font-variant-numeric: tabular-nums; }
    .round-line { color: var(--muted); font-size: 18px; }
    .tomato-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 0; }
    .settings-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 20px 0 0; }
    .settings-row .field { width: min(170px, 45%); text-align: left; }
    .stats { margin-top: 18px; padding: 17px; text-align: center; background: #0c1728; border: 1px solid #253651; border-radius: 12px; color: var(--muted); }
    .stats strong { display: block; color: var(--green); font-size: clamp(24px, 5vw, 38px); margin-top: 4px; }
    .hidden { display: none !important; }
    .presentation { width: 100%; max-width: none; min-height: 100vh; padding: 2vh 3vw; display: flex; flex-direction: column; justify-content: center; }
    .presentation .site-header, .presentation .edit-card, .presentation .exam-top, .presentation .notice-editor, .presentation .fullscreen-enter { display: none !important; }
    .presentation .marquee-wrap { margin-top: 0; }
    .presentation .clock-card { padding: 2vh 2vw; border: 0; box-shadow: none; background: transparent; }
    .presentation .clock { font-size: clamp(110px, 24vw, 340px); }
    .presentation .date-line { font-size: clamp(22px, 3vw, 38px); }
    .presentation .exam-meta { gap: 1.2vw; }
    .presentation .meta-item { padding: 1.4vw 1.5vw; }
    .presentation .meta-label { font-size: clamp(15px, 1.5vw, 23px); }
    .presentation .meta-value { font-size: clamp(23px, 2.8vw, 43px); }
    .presentation .remaining { font-size: clamp(32px, 5vw, 64px); }
    .fullscreen-exit { position: fixed; right: 16px; top: 14px; z-index: 5; opacity: .25; }
    .fullscreen-exit:hover, .fullscreen-exit:focus-visible { opacity: 1; }
    @media (max-width: 800px) {
      .app { padding: 14px 14px 30px; }
      .site-header { align-items: flex-start; flex-direction: column; }
      .tabs { width: 100%; }
      .tab-button { flex: 1; padding: 11px 7px; font-size: 14px; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .exam-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .schedule-form { grid-template-columns: 1fr 1fr; }
      .schedule-form .field:first-child { grid-column: span 2; }
    }
    @media (max-width: 480px) {
      .field.wide { grid-column: span 2; }
      .schedule-row { grid-template-columns: 1fr auto; gap: 8px; }
      .schedule-row .schedule-time.end { grid-column: 2; }
      .schedule-row .button { grid-column: span 2; }
      .bell-actions { grid-template-columns: 1fr; }
      .button.large { min-height: 76px; }
    }
    @media (prefers-reduced-motion: reduce) { .marquee-text { animation: none; padding-left: 0; width: auto; } }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="site-header">
      <p class="brand">考場工具箱</p>
      <nav class="tabs" role="tablist" aria-label="工具分頁">
        <button class="tab-button" id="tab-exam" role="tab" aria-selected="true" aria-controls="panel-exam">考試大鐘</button>
        <button class="tab-button" id="tab-bell" role="tab" aria-selected="false" aria-controls="panel-bell">上下課鐘</button>
        <button class="tab-button" id="tab-tomato" role="tab" aria-selected="false" aria-controls="panel-tomato">讀書番茄鐘</button>
      </nav>
    </header>

    <section class="tab-panel active" id="panel-exam" role="tabpanel" aria-labelledby="tab-exam">
      <div class="exam-top">
        <h1 class="page-title">考試大鐘</h1>
        <button class="button primary fullscreen-enter" id="fullscreenButton" type="button">全螢幕</button>
      </div>
      <div class="notice-editor">
        <label for="noticeInput">考試注意事項</label>
        <input id="noticeInput" type="text" maxlength="160" placeholder="例如：請將手機關機，並確認答案卡已填妥">
      </div>
      <div class="marquee-wrap" aria-label="考試注意事項跑馬燈">
        <div class="marquee-text" id="noticeMarquee">考試注意事項：請輸入提醒事項</div>
      </div>
      <section class="card clock-card" aria-label="目前時間與考試資訊">
        <div class="date-line" id="dateLine"></div>
        <div class="clock" id="wallClock" aria-live="off">--:--:--</div>
        <div class="exam-meta">
          <div class="meta-item"><span class="meta-label">考試科目</span><strong class="meta-value" id="displaySubject">尚未設定</strong></div>
          <div class="meta-item"><span class="meta-label">考試時間</span><strong class="meta-value" id="displayExamTime">--:-- ～ --:--</strong></div>
          <div class="meta-item"><span class="meta-label">監考老師</span><strong class="meta-value" id="displayTeacher">尚未設定</strong></div>
          <div class="meta-item"><span class="meta-label">應到／實到／缺考</span><strong class="meta-value" id="displayAttendance">0／0／0 人</strong></div>
        </div>
        <p class="remaining" id="remainingText">請設定考試結束時間</p>
      </section>
      <section class="card edit-card">
        <h2 class="section-heading">考試資訊設定</h2>
        <div class="form-grid">
          <label class="field">考試科目<input id="subjectInput" type="text" maxlength="60" placeholder="例如：數學"></label>
          <label class="field">監考老師<input id="teacherInput" type="text" maxlength="60" placeholder="例如：王老師"></label>
          <label class="field">開始時間<input id="startInput" type="time"></label>
          <label class="field">結束時間<input id="endInput" type="time"></label>
          <label class="field">應到人數<input id="expectedInput" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="field">實到人數<input id="presentInput" type="number" min="0" step="1" inputmode="numeric"></label>
        </div>
        <div class="form-actions"><span class="status" id="examStatus" role="status"></span></div>
      </section>
    </section>

    <section class="tab-panel" id="panel-bell" role="tabpanel" aria-labelledby="tab-bell">
      <h1 class="page-title">上下課鐘</h1>
      <div class="bell-actions" style="margin-top:18px">
        <button class="button large bell-class" id="classBellButton" type="button">上課鈴</button>
        <button class="button large bell-dismiss" id="dismissBellButton" type="button">下課鈴</button>
      </div>
      <p class="status" id="bellStatus" role="status" style="margin-top:10px"></p>
      <section class="card edit-card">
        <div class="schedule-controls">
          <h2 class="section-heading" style="margin:0">課表</h2>
          <label class="toggle"><input id="autoBellToggle" type="checkbox"> 啟用自動打鐘</label>
        </div>
        <form class="schedule-form" id="scheduleForm">
          <label class="field">節次名稱<input id="periodName" type="text" maxlength="30" placeholder="第一節" required></label>
          <label class="field">上課時間<input id="classTime" type="time" required></label>
          <label class="field">下課時間<input id="dismissTime" type="time" required></label>
          <button class="button primary" type="submit">新增課表</button>
        </form>
        <div class="schedule-list" id="scheduleList"></div>
        <h3 class="subheading">匯入 CSV 課表</h3>
        <p class="status">每行格式：節次名稱,上課時間,下課時間（例如：第一節,08:10,09:00）</p>
        <div class="form-actions">
          <label class="field" style="max-width:420px">選擇 CSV 檔<input id="csvInput" type="file" accept=".csv,text/csv"></label>
          <button class="button" id="importButton" type="button">匯入課表</button>
        </div>
        <p class="status" id="scheduleStatus" role="status"></p>
      </section>
    </section>

    <section class="tab-panel" id="panel-tomato" role="tabpanel" aria-labelledby="tab-tomato">
      <h1 class="page-title">讀書番茄鐘</h1>
      <section class="card tomato-card" style="margin-top:18px">
        <div class="tomato-phase" id="tomatoPhase">專注時間</div>
        <div class="tomato-clock" id="tomatoClock" role="timer" aria-live="off">25:00</div>
        <div class="round-line" id="roundDisplay">第 1 輪</div>
        <div class="tomato-actions">
          <button class="button primary" id="startPauseButton" type="button">開始</button>
          <button class="button" id="resetTomatoButton" type="button">重設</button>
          <button class="button" id="skipTomatoButton" type="button">跳過</button>
        </div>
        <div class="settings-row">
          <label class="field">專注（分鐘）<input id="focusMinutes" type="number" min="1" max="180" step="1"></label>
          <label class="field">休息（分鐘）<input id="breakMinutes" type="number" min="1" max="60" step="1"></label>
        </div>
        <div class="stats">累計專注時間<strong id="focusStats">0 分鐘</strong></div>
        <p class="status" id="tomatoStatus" role="status"></p>
      </section>
    </section>
  </main>
  <button class="button fullscreen-exit hidden" id="fullscreenExit" type="button" aria-label="離開全螢幕">離開全螢幕</button>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "exam-toolbox-v1";
      const defaults = {
        exam: { subject: "", teacher: "", start: "", end: "", expected: 0, present: 0, notice: "" },
        schedule: [],
        autoBell: false,
        tomato: { focusMinutes: 25, breakMinutes: 5, phase: "focus", round: 1, remainingSeconds: 1500, focusSeconds: 0, running: false, deadline: null }
      };
      let state = loadState();
      let audioContext = null;
      let ticker = null;
      let lastAutoBellKey = "";
      let isFullscreen = false;

      const $ = (id) => document.getElementById(id);
      const examFields = {
        subject: $("subjectInput"), teacher: $("teacherInput"), start: $("startInput"),
        end: $("endInput"), expected: $("expectedInput"), present: $("presentInput")
      };

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!saved || typeof saved !== "object") return structuredCopy(defaults);
          const merged = structuredCopy(defaults);
          if (saved.exam && typeof saved.exam === "object") Object.assign(merged.exam, saved.exam);
          if (Array.isArray(saved.schedule)) merged.schedule = saved.schedule.filter(validPeriod);
          if (typeof saved.autoBell === "boolean") merged.autoBell = saved.autoBell;
          if (saved.tomato && typeof saved.tomato === "object") Object.assign(merged.tomato, saved.tomato);
          merged.tomato.focusMinutes = clampInteger(merged.tomato.focusMinutes, 1, 180, 25);
          merged.tomato.breakMinutes = clampInteger(merged.tomato.breakMinutes, 1, 60, 5);
          merged.tomato.phase = merged.tomato.phase === "break" ? "break" : "focus";
          merged.tomato.round = clampInteger(merged.tomato.round, 1, 1000000, 1);
          merged.tomato.remainingSeconds = clampInteger(merged.tomato.remainingSeconds, 0, 10800, merged.tomato.focusMinutes * 60);
          merged.tomato.focusSeconds = clampInteger(merged.tomato.focusSeconds, 0, 2147483647, 0);
          merged.tomato.running = false;
          merged.tomato.deadline = null;
          return merged;
        } catch (error) {
          console.error("無法讀取已儲存的設定：", error);
          return structuredCopy(defaults);
        }
      }

      function structuredCopy(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          console.error("無法儲存設定：", error);
          const status = $("examStatus");
          status.textContent = "瀏覽器無法儲存資料，請確認儲存空間設定。";
          status.className = "status error";
        }
      }

      function clampInteger(value, min, max, fallback) {
        const number = Number(value);
        return Number.isInteger(number) ? Math.min(max, Math.max(min, number)) : fallback;
      }

      function validTime(time) {
        return typeof time === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(time);
      }

      function validPeriod(period) {
        return period && typeof period.name === "string" && period.name.trim() &&
          validTime(period.start) && validTime(period.end);
      }

      function setStatus(id, message, kind) {
        const element = $(id);
        element.textContent = message;
        element.className = `status${kind ? ` ${kind}` : ""}`;
      }

      function updateClock() {
        const now = new Date();
        $("wallClock").textContent = [now.getHours(), now.getMinutes(), now.getSeconds()]
          .map((part) => String(part).padStart(2, "0")).join(":");
        $("dateLine").textContent = new Intl.DateTimeFormat("zh-TW", {
          year: "numeric", month: "long", day: "numeric", weekday: "long"
        }).format(now);
        updateRemaining(now);
        checkSchedule(now);
      }

      function updateRemaining(now) {
        const end = state.exam.end;
        const display = $("remainingText");
        display.classList.remove("warning", "finished");
        if (!validTime(end)) {
          display.textContent = "請設定考試結束時間";
          return;
        }
        const [hours, minutes] = end.split(":").map(Number);
        const endTime = new Date(now);
        endTime.setHours(hours, minutes, 0, 0);
        let milliseconds = endTime.getTime() - now.getTime();
        if (milliseconds < 0 && state.exam.start && validTime(state.exam.start)) {
          const [startHour, startMinute] = state.exam.start.split(":").map(Number);
          const startTime = new Date(now);
          startTime.setHours(startHour, startMinute, 0, 0);
          if (startTime > endTime && now < startTime) endTime.setDate(endTime.getDate() + 1);
          milliseconds = endTime.getTime() - now.getTime();
        }
        if (milliseconds <= 0) {
          display.textContent = "考試時間已結束";
          display.classList.add("finished");
          return;
        }
        const totalSeconds = Math.ceil(milliseconds / 1000);
        const remainingMinutes = Math.ceil(totalSeconds / 60);
        const hoursLeft = Math.floor(totalSeconds / 3600);
        const minutesLeft = Math.floor((totalSeconds % 3600) / 60);
        const secondsLeft = totalSeconds % 60;
        const detail = hoursLeft > 0
          ? `${hoursLeft} 小時 ${minutesLeft} 分 ${secondsLeft} 秒`
          : `${minutesLeft} 分 ${secondsLeft} 秒`;
        display.textContent = `距離考試結束還有 ${remainingMinutes} 分鐘（${detail}）`;
        if (remainingMinutes <= 10) display.classList.add("warning");
      }

      function syncExamForm() {
        for (const [key, input] of Object.entries(examFields)) {
          input.value = state.exam[key] ?? "";
        }
        $("noticeInput").value = state.exam.notice || "";
        renderExamInfo();
      }

      function renderExamInfo() {
        $("displaySubject").textContent = state.exam.subject || "尚未設定";
        $("displayTeacher").textContent = state.exam.teacher || "尚未設定";
        $("displayExamTime").textContent = `${validTime(state.exam.start) ? state.exam.start : "--:--"} ～ ${validTime(state.exam.end) ? state.exam.end : "--:--"}`;
        const expected = clampInteger(state.exam.expected, 0, 1000000, 0);
        const present = clampInteger(state.exam.present, 0, 1000000, 0);
        $("displayAttendance").textContent = `${expected}／${present}／${Math.max(0, expected - present)} 人`;
        const notice = state.exam.notice.trim() || "請輸入考試提醒事項";
        $("noticeMarquee").textContent = `考試注意事項：${notice}`;
      }

      function onExamInput(event) {
        const key = event.target.dataset.examField;
        if (key === "expected" || key === "present") {
          const parsed = event.target.value === "" ? 0 : Number(event.target.value);
          if (!Number.isInteger(parsed) || parsed < 0) {
            setStatus("examStatus", "人數請輸入 0 或正整數。", "error");
            return;
          }
          state.exam[key] = parsed;
        } else {
          if ((key === "start" || key === "end") && event.target.value && !validTime(event.target.value)) {
            setStatus("examStatus", "請輸入有效的 24 小時制時間。", "error");
            return;
          }
          state.exam[key] = event.target.value;
        }
        setStatus("examStatus", "");
        renderExamInfo();
        updateClock();
        persist();
      }

      function activateTab(tabId) {
        document.querySelectorAll(".tab-button").forEach((button) => {
          const selected = button.id === tabId;
          button.setAttribute("aria-selected", String(selected));
          $(button.getAttribute("aria-controls")).classList.toggle("active", selected);
        });
      }

      function getAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("此瀏覽器不支援 Web Audio API。");
        if (!audioContext) audioContext = new AudioContextClass();
        return audioContext;
      }

      async function ringBell(type, statusId) {
        try {
          const context = getAudioContext();
          if (context.state === "suspended") await context.resume();
          const now = context.currentTime;
          const notes = type === "class"
            ? [{ f: 880, t: 0, d: .42 }, { f: 1174.66, t: .48, d: .42 }, { f: 1396.91, t: .96, d: .85 }]
            : [{ f: 1396.91, t: 0, d: .45 }, { f: 1174.66, t: .5, d: .45 }, { f: 880, t: 1, d: .9 }];
          notes.forEach((note) => {
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(note.f, now + note.t);
            gain.gain.setValueAtTime(0.0001, now + note.t);
            gain.gain.exponentialRampToValueAtTime(0.22, now + note.t + .025);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + note.t + note.d);
            oscillator.connect(gain);
            gain.connect(context.destination);
            oscillator.start(now + note.t);
            oscillator.stop(now + note.t + note.d + .02);
          });
          if (statusId) setStatus(statusId, type === "class" ? "已播放上課鈴。" : "已播放下課鈴。", "success");
        } catch (error) {
          console.error("播放鈴聲失敗：", error);
          if (statusId) setStatus(statusId, `無法播放鈴聲：${error.message}`, "error");
        }
      }

      function checkSchedule(now) {
        if (!state.autoBell) return;
        const time = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
        const day = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
        state.schedule.forEach((period, index) => {
          const type = period.start === time ? "class" : period.end === time ? "dismiss" : "";
          const eventKey = `${day}-${time}-${index}-${type}`;
          if (type && eventKey !== lastAutoBellKey) {
            lastAutoBellKey = eventKey;
            ringBell(type, "bellStatus");
          }
        });
      }

      function renderSchedule() {
        const list = $("scheduleList");
        list.replaceChildren();
        if (!state.schedule.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "尚未新增課表。";
          list.append(empty);
          return;
        }
        state.schedule.forEach((period, index) => {
          const row = document.createElement("div");
          row.className = "schedule-row";
          const name = document.createElement("span");
          name.className = "schedule-name";
          name.textContent = period.name;
          const start = document.createElement("span");
          start.className = "schedule-time";
          start.textContent = `上課 ${period.start}`;
          const end = document.createElement("span");
          end.className = "schedule-time end";
          end.textContent = `下課 ${period.end}`;
          const remove = document.createElement("button");
          remove.className = "button danger";
          remove.type = "button";
          remove.textContent = "刪除";
          remove.setAttribute("aria-label", `刪除${period.name}`);
          remove.addEventListener("click", () => {
            state.schedule.splice(index, 1);
            persist();
            renderSchedule();
          });
          row.append(name, start, end, remove);
          list.append(row);
        });
      }

      function parseCsvLine(line) {
        const values = [];
        let value = "";
        let quoted = false;
        for (let i = 0; i < line.length; i += 1) {
          const character = line[i];
          if (character === '"') {
            if (quoted && line[i + 1] === '"') { value += '"'; i += 1; }
            else quoted = !quoted;
          } else if (character === "," && !quoted) {
            values.push(value.trim());
            value = "";
          } else value += character;
        }
        if (quoted) throw new Error("CSV 有未成對的雙引號。");
        values.push(value.trim());
        return values;
      }

      async function importCsv() {
        const file = $("csvInput").files[0];
        if (!file) {
          setStatus("scheduleStatus", "請先選擇 CSV 檔案。", "error");
          return;
        }
        try {
          const text = (await file.text()).replace(/^\uFEFF/, "");
          const rows = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
          const imported = [];
          for (let index = 0; index < rows.length; index += 1) {
            const columns = parseCsvLine(rows[index]);
            if (columns.length !== 3 || !columns[0] || !validTime(columns[1]) || !validTime(columns[2])) {
              throw new Error(`第 ${index + 1} 行格式錯誤，請使用「節次,上課時間,下課時間」。`);
            }
            imported.push({ name: columns[0], start: columns[1], end: columns[2] });
          }
          if (!imported.length) throw new Error("檔案沒有可匯入的課表資料。");
          state.schedule.push(...imported);
          persist();
          renderSchedule();
          $("csvInput").value = "";
          setStatus("scheduleStatus", `成功匯入 ${imported.length} 節課表。`, "success");
        } catch (error) {
          console.error("匯入 CSV 失敗：", error);
          setStatus("scheduleStatus", `匯入失敗：${error.message}`, "error");
        }
      }

      function effectiveRemainingSeconds() {
        if (state.tomato.running && Number.isFinite(state.tomato.deadline)) {
          return Math.max(0, Math.ceil((state.tomato.deadline - Date.now()) / 1000));
        }
        return state.tomato.remainingSeconds;
      }

      function renderTomato() {
        const tomato = state.tomato;
        const remaining = effectiveRemainingSeconds();
        $("tomatoClock").textContent = `${String(Math.floor(remaining / 60)).padStart(2, "0")}:${String(remaining % 60).padStart(2, "0")}`;
        $("tomatoPhase").textContent = tomato.phase === "focus" ? "專注時間" : "休息時間";
        $("tomatoPhase").style.color = tomato.phase === "focus" ? "var(--cyan)" : "var(--green)";
        $("roundDisplay").textContent = `第 ${tomato.round} 輪`;
        $("startPauseButton").textContent = tomato.running ? "暫停" : "開始";
        $("focusMinutes").value = tomato.focusMinutes;
        $("breakMinutes").value = tomato.breakMinutes;
        const totalMinutes = Math.floor(tomato.focusSeconds / 60);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        $("focusStats").textContent = hours ? `${hours} 小時 ${minutes} 分鐘` : `${totalMinutes} 分鐘`;
      }

      function applyTomatoSettings() {
        const focus = Number($("focusMinutes").value);
        const rest = Number($("breakMinutes").value);
        if (!Number.isInteger(focus) || focus < 1 || focus > 180 ||
            !Number.isInteger(rest) || rest < 1 || rest > 60) {
          setStatus("tomatoStatus", "專注需為 1–180 分鐘，休息需為 1–60 分鐘。", "error");
          renderTomato();
          return false;
        }
        state.tomato.focusMinutes = focus;
        state.tomato.breakMinutes = rest;
        if (!state.tomato.running) {
          state.tomato.remainingSeconds = (state.tomato.phase === "focus" ? focus : rest) * 60;
        }
        persist();
        renderTomato();
        setStatus("tomatoStatus", "");
        return true;
      }

      function tickTomato() {
        if (!state.tomato.running) return;
        let remaining = effectiveRemainingSeconds();
        while (remaining <= 0) {
          const finishedPhase = state.tomato.phase;
          if (finishedPhase === "focus") {
            state.tomato.phase = "break";
            state.tomato.remainingSeconds = state.tomato.breakMinutes * 60;
            setStatus("tomatoStatus", "專注時間結束，開始休息。", "success");
            ringBell("dismiss", null);
          } else {
            state.tomato.phase = "focus";
            state.tomato.round += 1;
            state.tomato.remainingSeconds = state.tomato.focusMinutes * 60;
            setStatus("tomatoStatus", "休息結束，開始下一輪專注。", "success");
            ringBell("class", null);
          }
          state.tomato.deadline += state.tomato.remainingSeconds * 1000;
          remaining = effectiveRemainingSeconds();
        }
        renderTomato();
      }

      function startTomato() {
        if (!state.tomato.running && !applyTomatoSettings()) return;
        if (!state.tomato.running) {
          state.tomato.deadline = Date.now() + state.tomato.remainingSeconds * 1000;
          state.tomato.running = true;
          setStatus("tomatoStatus", "");
          persist();
        } else {
          const elapsed = Math.max(0, state.tomato.remainingSeconds - effectiveRemainingSeconds());
          if (state.tomato.phase === "focus") state.tomato.focusSeconds += elapsed;
          state.tomato.remainingSeconds = effectiveRemainingSeconds();
          state.tomato.deadline = null;
          state.tomato.running = false;
          persist();
        }
        renderTomato();
      }

      function resetTomato() {
        state.tomato.running = false;
        state.tomato.deadline = null;
        state.tomato.remainingSeconds = (state.tomato.phase === "focus" ? state.tomato.focusMinutes : state.tomato.breakMinutes) * 60;
        persist();
        renderTomato();
        setStatus("tomatoStatus", "本輪已重設。");
      }

      function skipTomato() {
        const currentRemaining = effectiveRemainingSeconds();
        if (state.tomato.running && state.tomato.phase === "focus") {
          const elapsed = Math.max(0, state.tomato.remainingSeconds - currentRemaining);
          state.tomato.focusSeconds += elapsed;
        }
        const nextPhase = state.tomato.phase === "focus" ? "break" : "focus";
        if (nextPhase === "focus") state.tomato.round += 1;
        state.tomato.phase = nextPhase;
        state.tomato.remainingSeconds = (nextPhase === "focus" ? state.tomato.focusMinutes : state.tomato.breakMinutes) * 60;
        state.tomato.running = false;
        state.tomato.deadline = null;
        persist();
        renderTomato();
        setStatus("tomatoStatus", nextPhase === "focus" ? "已跳過休息，準備開始專注。" : "已跳過專注，準備休息。");
      }

      async function enterFullscreen() {
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
          isFullscreen = true;
          $("app").classList.add("presentation");
          $("fullscreenExit").classList.remove("hidden");
        } catch (error) {
          console.error("無法進入全螢幕：", error);
          setStatus("examStatus", "無法進入全螢幕，請確認瀏覽器允許此操作。", "error");
        }
      }

      function leaveFullscreen() {
        isFullscreen = false;
        $("app").classList.remove("presentation");
        $("fullscreenExit").classList.add("hidden");
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch((error) => console.error("離開全螢幕失敗：", error));
        }
      }

      document.querySelectorAll(".tab-button").forEach((button) => {
        button.addEventListener("click", () => activateTab(button.id));
      });
      Object.entries(examFields).forEach(([key, input]) => {
        input.dataset.examField = key;
        input.addEventListener("input", onExamInput);
        input.addEventListener("change", onExamInput);
      });
      $("noticeInput").addEventListener("input", (event) => {
        state.exam.notice = event.target.value;
        renderExamInfo();
        persist();
      });
      $("classBellButton").addEventListener("click", () => ringBell("class", "bellStatus"));
      $("dismissBellButton").addEventListener("click", () => ringBell("dismiss", "bellStatus"));
      $("autoBellToggle").checked = state.autoBell;
      $("autoBellToggle").addEventListener("change", async (event) => {
        state.autoBell = event.target.checked;
        persist();
        if (state.autoBell) {
          try {
            const context = getAudioContext();
            if (context.state === "suspended") await context.resume();
            setStatus("bellStatus", "已啟用自動打鐘。請保持此頁開啟；瀏覽器可能會限制背景分頁播放。", "success");
          } catch (error) {
            console.error("啟用自動打鐘時無法啟動音訊：", error);
            setStatus("bellStatus", `自動打鐘已啟用，但音訊無法啟動：${error.message}`, "error");
          }
        } else setStatus("bellStatus", "已停用自動打鐘。");
      });
      $("scheduleForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const period = {
          name: $("periodName").value.trim(),
          start: $("classTime").value,
          end: $("dismissTime").value
        };
        if (!validPeriod(period)) {
          setStatus("scheduleStatus", "請輸入節次名稱與有效的上、下課時間。", "error");
          return;
        }
        state.schedule.push(period);
        persist();
        renderSchedule();
        event.target.reset();
        setStatus("scheduleStatus", "已新增課表。", "success");
      });
      $("importButton").addEventListener("click", importCsv);
      $("focusMinutes").addEventListener("change", applyTomatoSettings);
      $("breakMinutes").addEventListener("change", applyTomatoSettings);
      $("startPauseButton").addEventListener("click", startTomato);
      $("resetTomatoButton").addEventListener("click", resetTomato);
      $("skipTomatoButton").addEventListener("click", skipTomato);
      $("fullscreenButton").addEventListener("click", enterFullscreen);
      $("fullscreenExit").addEventListener("click", leaveFullscreen);
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && isFullscreen) {
          isFullscreen = false;
          $("app").classList.remove("presentation");
          $("fullscreenExit").classList.add("hidden");
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && isFullscreen) leaveFullscreen();
      });
      document.addEventListener("visibilitychange", () => {
        if (state.tomato.running && state.tomato.phase === "focus") {
          const remaining = effectiveRemainingSeconds();
          const elapsed = Math.max(0, state.tomato.remainingSeconds - remaining);
          state.tomato.focusSeconds += elapsed;
          state.tomato.remainingSeconds = remaining;
          state.tomato.deadline = Date.now() + remaining * 1000;
          persist();
        }
      });

      syncExamForm();
      renderSchedule();
      renderTomato();
      $("autoBellToggle").checked = state.autoBell;
      updateClock();
      ticker = window.setInterval(() => {
        updateClock();
        if (state.tomato.running) {
          const before = state.tomato.remainingSeconds;
          const after = effectiveRemainingSeconds();
          if (state.tomato.phase === "focus" && after < before) {
            state.tomato.focusSeconds += before - after;
            state.tomato.remainingSeconds = after;
          }
          tickTomato();
          if (state.tomato.running) persist();
        }
      }, 1000);
      window.addEventListener("beforeunload", () => {
        if (state.tomato.running) {
          const remaining = effectiveRemainingSeconds();
          if (state.tomato.phase === "focus") {
            state.tomato.focusSeconds += Math.max(0, state.tomato.remainingSeconds - remaining);
          }
          state.tomato.remainingSeconds = remaining;
          state.tomato.running = false;
          state.tomato.deadline = null;
        }
        persist();
        window.clearInterval(ticker);
      });
    })();
  </script>
</body>
</html>
